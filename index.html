<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 功能手册</title>
<style>
  /* ============ Reset & Base ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #f8f9fa;
    color: #1a1a2e;
    line-height: 1.6;
    min-height: 100vh;
  }
  ::selection { background: rgba(99,102,241,0.15); }

  /* ============ Header ============ */
  .app-header {
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 32px 20px;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: -0.3px;
  }
  .header-sub {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
    margin-left: 44px;
  }
  .header-sub .version {
    font-size: 12px;
    color: #8b8fa3;
    background: #f0f1f3;
    padding: 2px 10px;
    border-radius: 6px;
  }
  .header-sub .update-date {
    font-size: 12px;
    color: #8b8fa3;
  }

  /* ============ Toolbar ============ */
  .toolbar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 32px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    position: relative;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #b0b3c1;
    font-size: 14px;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 10px;
    border: 1.5px solid #e0e2e8;
    background: #fff;
    color: #1a1a2e;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  .search-wrap input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .search-wrap input::placeholder { color: #b0b3c1; }

  .toolbar-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid #e0e2e8;
    background: #fff;
    color: #4b4f62;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .btn:hover {
    border-color: #c4c7d0;
    background: #f8f9fa;
    color: #1a1a2e;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: #6366f1;
    border-color: #6366f1;
    color: #fff;
  }
  .btn-primary:hover {
    background: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
  }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: #f0f1f3; border-color: transparent; }

  /* ============ Stats ============ */
  .stats-bar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px 16px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #8b8fa3;
  }
  .stat-item .num {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: -0.3px;
    font-variant-numeric: tabular-nums;
  }
  .stat-item .num-accent { color: #6366f1; }
  .stat-dot { width: 4px; height: 4px; border-radius: 50%; background: #d0d2d9; }

  /* ============ Filters ============ */
  .filters-wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px 4px;
  }
  .category-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .category-filters::-webkit-scrollbar { display: none; }
  .cat-pill {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1.5px solid #e8eaed;
    background: #fff;
    color: #6b6f82;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
    font-weight: 500;
  }
  .cat-pill:hover {
    border-color: #c4c7d0;
    color: #1a1a2e;
  }
  .cat-pill.active {
    background: rgba(99,102,241,0.06);
    border-color: #6366f1;
    color: #6366f1;
  }

  /* ============ Main ============ */
  .main-content {
    max-width: 1120px;
    margin: 0 auto;
    padding: 8px 32px 64px;
  }

  /* ============ Category Section ============ */
  .category-section {
    margin-bottom: 28px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    cursor: pointer;
    user-select: none;
    padding: 0 4px;
  }
  .cat-icon-wrap {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .category-header h2 {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a2e;
    flex: 1;
  }
  .category-header .count-badge {
    font-size: 11px;
    color: #8b8fa3;
    background: #f0f1f3;
    padding: 1px 10px;
    border-radius: 10px;
    font-weight: 500;
  }
  .cat-arrow {
    font-size: 10px;
    color: #b0b3c1;
    transition: transform 0.2s ease;
  }
  .category-header.collapsed .cat-arrow { transform: rotate(-90deg); }
  .category-body {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .category-header.collapsed + .category-body { display: none; }

  /* ============ Feature Card ============ */
  .feature-card {
    background: #fff;
    border: 1.5px solid #e8eaed;
    border-radius: 12px;
    padding: 18px 20px;
    transition: all 0.2s ease;
  }
  .feature-card:hover {
    border-color: #d0d2d9;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    transform: translateY(-1px);
  }
  .feature-card.popular {
    background: linear-gradient(135deg, #faf5ff 0%, #f5f3ff 100%);
    border-color: #e4d9f7;
  }
  .feature-card.popular:hover {
    border-color: #cdbcf0;
    box-shadow: 0 4px 16px rgba(99,102,241,0.06);
  }
  .feature-card.popular .card-name::after {
    content: '常用';
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    background: #6366f1;
    color: #fff;
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }
  .feature-card.popular .card-name code::after {
    content: '常用';
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    background: #6366f1;
    color: #fff;
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }
  .feature-card .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 8px;
  }
  .badge-new {
    background: rgba(16,185,129,0.1);
    color: #059669;
    border: 1px solid rgba(16,185,129,0.15);
  }
  .badge-beta {
    background: rgba(245,158,11,0.1);
    color: #d97706;
    border: 1px solid rgba(245,158,11,0.15);
  }
  .badge-stable {
    display: none !important;
  }

  .feature-card .card-name {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 5px;
    line-height: 1.3;
  }
  .feature-card .card-name code {
    font-family: 'SF Mono', 'SFMono-Regular', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #6366f1;
    background: rgba(99,102,241,0.06);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .feature-card .card-desc {
    font-size: 13px;
    color: #6b6f82;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .card-meta {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .meta-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    align-items: flex-start;
    line-height: 1.4;
  }
  .meta-row .label {
    color: #b0b3c1;
    min-width: 44px;
    flex-shrink: 0;
    font-weight: 500;
  }
  .meta-row .value {
    color: #4b4f62;
  }
  .meta-row .value code {
    font-family: 'SF Mono', 'SFMono-Regular', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11px;
    background: #f0f1f3;
    padding: 1px 7px;
    border-radius: 4px;
    color: #4b4f62;
    word-break: break-all;
  }
  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #f0f1f3;
  }
  .card-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: #f0f1f3;
    color: #8b8fa3;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  /* ============ Modal ============ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    max-width: 540px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 2px;
  }
  .modal .modal-sub {
    font-size: 13px;
    color: #8b8fa3;
    margin-bottom: 20px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #6b6f82;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .form-group label .req { color: #ef4444; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid #e0e2e8;
    background: #fff;
    color: #1a1a2e;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .form-group textarea { resize: vertical; min-height: 52px; }
  .form-group select { cursor: pointer; }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #f0f1f3;
  }

  /* ============ JSON ============ */
  .json-editor {
    width: 100%;
    min-height: 320px;
    font-family: 'SF Mono', 'SFMono-Regular', 'Fira Code', monospace;
    font-size: 12px;
    padding: 16px;
    border-radius: 10px;
    border: 1.5px solid #e0e2e8;
    background: #f8f9fa;
    color: #1a1a2e;
    resize: vertical;
    outline: none;
    tab-size: 2;
    line-height: 1.6;
  }
  .json-editor:focus { border-color: #6366f1; }

  /* ============ Toast ============ */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    transform: translateY(16px);
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: #10b981; color: #fff; }
  .toast.error { background: #ef4444; color: #fff; }
  .toast.info { background: #6366f1; color: #fff; }

  /* ============ Empty ============ */
  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: #b0b3c1;
    grid-column: 1 / -1;
  }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.6; }
  .empty-state p { font-size: 14px; }

  /* ============ Responsive ============ */
  @media (max-width: 768px) {
    .header-inner { padding: 20px 20px 16px; }
    .header-sub { margin-left: 0; }
    .toolbar { padding: 10px 20px; }
    .stats-bar { padding: 0 20px 12px; gap: 14px; }
    .filters-wrap { padding: 0 20px 4px; }
    .main-content { padding: 4px 20px 48px; }
    .category-body { grid-template-columns: 1fr; }
    .btn span { display: none; }
    .modal { padding: 20px; }
  }

  @media (max-width: 480px) {
    .stats-bar .stat-dot { display: none; }
    .stats-bar { gap: 10px; }
    .stat-item .num { font-size: 15px; }
  }

  /* ============ Animation ============ */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .category-body .feature-card {
    animation: cardIn 0.25s ease-out both;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo-mark">CC</div>
      <h1>Claude Code 功能手册</h1>
    </div>
    <div class="header-sub">
      <span class="version">v2.1.218</span>
      <span class="update-date">2026 年 7 月</span>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">&#x1F50D;</span>
    <input type="text" id="searchInput" placeholder="搜索功能名称、场景、标签..." oninput="render()">
  </div>
  <div class="toolbar-actions">
    <button class="btn" onclick="showAddModal()">+ 添加</button>
    <button class="btn btn-ghost" onclick="showJsonModal()">{ } JSON</button>
    <button class="btn btn-ghost" onclick="exportJson()">导出</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="filters-wrap">
  <div class="category-filters" id="categoryFilters"></div>
</div>

<main class="main-content" id="featureContainer"></main>

<!-- Add Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>添加新功能</h3>
    <p class="modal-sub">新增功能会保存到浏览器本地存储</p>
    <div class="form-group">
      <label>功能名称 <span class="req">*</span></label>
      <input id="fName" placeholder="如: /deep-research">
    </div>
    <div class="form-group">
      <label>分类 <span class="req">*</span></label>
      <select id="fCategory">
        <option value="模型">模型</option>
        <option value="命令">命令</option>
        <option value="Auto 模式">Auto 模式</option>
        <option value="子 Agent / 工作流">子 Agent / 工作流</option>
        <option value="Artifacts">Artifacts</option>
        <option value="桌面端">桌面端</option>
        <option value="安全与修复">安全与修复</option>
        <option value="MCP">MCP</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>简介 <span class="req">*</span></label>
      <textarea id="fDesc" placeholder="一句话描述功能"></textarea>
    </div>
    <div class="form-group">
      <label>使用方法</label>
      <input id="fUsage" placeholder="如: /command">
    </div>
    <div class="form-group">
      <label>使用场景</label>
      <textarea id="fScenario" placeholder="什么情况下用到这个功能"></textarea>
    </div>
    <div class="form-group">
      <label>引入版本</label>
      <input id="fVersion" placeholder="如: v2.1.150+">
    </div>
    <div class="form-group">
      <label>状态</label>
      <select id="fStatus">
        <option value="stable">stable</option>
        <option value="beta">beta</option>
        <option value="new">new</option>
      </select>
    </div>
    <div class="form-group">
      <label>标签（逗号分隔）</label>
      <input id="fTags" placeholder="如: model, opus, coding">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addModal')">取消</button>
      <button class="btn btn-primary" onclick="addFeature()">保存</button>
    </div>
  </div>
</div>

<!-- JSON Modal -->
<div class="modal-overlay" id="jsonModal">
  <div class="modal" style="max-width:720px">
    <h3>编辑数据源</h3>
    <p class="modal-sub">编辑底层 JSON 数据，新增字段自动渲染显示</p>
    <textarea class="json-editor" id="jsonEditor" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('jsonModal')">取消</button>
      <button class="btn btn-primary" onclick="importJson()">导入并覆盖</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ===================================================================
//  📦 数据源 — 开放性接口
//  新增字段自动渲染，无需修改代码
// ===================================================================
const featureData = [
  // ════════ 模型 ════════
  {
    name: 'Claude Opus 4.8',
    category: '模型',
    description: '最新旗舰模型，Max / Team Premium 默认，代码能力全面超越上代',
    usage: '/config model=opus-4-8',
    scenario: '复杂编码、大规模重构、高难度算法、深度推理',
    versionAdded: 'v2.1.150+',
    status: 'stable',
    tags: ['model', 'opus', 'coding']
  },
  {
    name: 'Claude Sonnet 5',
    category: '模型',
    description: 'Pro / Team Standard 新默认，原生 100 万 token 上下文窗口',
    usage: '升级后自动成为默认模型',
    scenario: '日常编码、超大文件处理、超长上下文分析',
    versionAdded: 'v2.1.195+',
    status: 'stable',
    tags: ['model', 'sonnet', 'long-context']
  },
  {
    name: 'Fast Mode',
    category: '模型',
    description: 'Opus 模型快速模式，保持推理质量的同时大幅提升响应速度',
    usage: '/effort 切换或协议自动协商',
    scenario: '需要 Opus 级别质量但希望更快拿到结果',
    versionAdded: 'v2.1.150+',
    status: 'stable',
    tags: ['model', 'speed', 'performance']
  },

  // ════════ 命令 ════════
  {
    name: '/',
    category: '命令',
    description: '列出所有可用斜杠命令及功能说明',
    usage: '/ 或 /slash',
    scenario: '想不起某个命令叫什么，或看看有哪些命令可用',
    versionAdded: 'v1.0',
    status: 'stable',
    tags: ['command', 'help', 'discover']
  },
  {
    name: '/help',
    category: '命令',
    description: '获取 Claude Code 帮助信息，快速上手',
    usage: '/help',
    scenario: '刚接触 Claude Code 或需要查阅基本用法',
    versionAdded: 'v1.0',
    status: 'stable',
    tags: ['command', 'help', 'basics']
  },
  {
    name: '/cd',
    popular: true,
    category: '命令',

// ===================================================================
//  🏗️ 分类视觉配置
// ===================================================================
const categoryConfig = {
  '模型':            { icon: '&#x1F916;', color: '#8b5cf6', bg: '#f5f3ff' },
  '命令':            { icon: '&#x2328;',  color: '#6366f1', bg: '#eef2ff' },
  'Auto 模式':       { icon: '&#x26A1;',  color: '#f59e0b', bg: '#fffbeb' },
  '子 Agent / 工作流': { icon: '&#x1F465;', color: '#10b981', bg: '#ecfdf5' },
  'Artifacts':       { icon: '&#x1F4E6;', color: '#f97316', bg: '#fff7ed' },
  '桌面端':           { icon: '&#x1F5A5;', color: '#06b6d4', bg: '#ecfeff' },
  '安全与修复':       { icon: '&#x1F6E1;', color: '#ef4444', bg: '#fef2f2' },
  'MCP':             { icon: '&#x1F517;', color: '#ec4899', bg: '#fdf2f8' },
  '其他':            { icon: '&#x1F4C1;', color: '#6b7280', bg: '#f9fafb' }
};

let customFeatures = [];

// ===================================================================
//  Render
// ===================================================================
function getAll() {
  try {
    const saved = localStorage.getItem('cc_custom_features');
    if (saved) customFeatures = JSON.parse(saved);
  } catch(e) {}
  return [...featureData, ...customFeatures];
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const activeCat = document.querySelector('.cat-pill.active')?.dataset?.cat || 'all';
  const all = getAll();

  let filtered = all.filter(f => {
    if (activeCat !== 'all' && f.category !== activeCat) return false;
    if (!search) return true;
    const haystack = [f.name, f.description, f.scenario, f.usage, ...(f.tags || [])].join(' ').toLowerCase();
    return haystack.includes(search);
  });

  const grouped = {};
  filtered.forEach(f => {
    const cat = f.category || '未分类';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(f);
  });

  const totalCustom = customFeatures.length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-item"><span class="num">${all.length}</span> 项功能${totalCustom ? ` <span style="color:#8b8fa3;font-size:12px;font-weight:400">(+${totalCustom} 自定义)</span>` : ''}</div>
    <div class="stat-dot"></div>
    <div class="stat-item"><span class="num ${activeCat !== 'all' ? 'num-accent' : ''}">${filtered.length}</span> 当前筛选</div>
    <div class="stat-dot"></div>
    <div class="stat-item"><span class="num">${Object.keys(grouped).length}</span> 个分类</div>
  `;

  const allCats = [...new Set(all.map(f => f.category || '未分类'))];
  const totalInCat = cat => all.filter(f => (f.category || '未分类') === cat).length;
  document.getElementById('categoryFilters').innerHTML =
    `<button class="cat-pill ${activeCat === 'all' ? 'active' : ''}" data-cat="all" onclick="setCat('all')">全部 <span style="color:#b0b3c1;font-size:11px;margin-left:3px">${all.length}</span></button>` +
    allCats.map(c =>
      `<button class="cat-pill ${activeCat === c ? 'active' : ''}" data-cat="${c}" onclick="setCat('${c}')">${c} <span style="color:#b0b3c1;font-size:11px;margin-left:3px">${totalInCat(c)}</span></button>`
    ).join('');

  const container = document.getElementById('featureContainer');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F50D;</div><p>没有匹配的功能，试试其他关键词</p></div>';
    return;
  }

  let idx = 0;
  container.innerHTML = Object.entries(grouped).map(([cat, features]) => {
    const cfg = categoryConfig[cat] || { icon: '&#x1F4CB;', color: '#6b7280', bg: '#f9fafb' };
    return `
      <div class="category-section">
        <div class="category-header" onclick="toggleCat(this)">
          <div class="cat-icon-wrap" style="background:${cfg.bg};color:${cfg.color}">${cfg.icon}</div>
          <h2>${cat}</h2>
          <span class="count-badge">${features.length}</span>
          <span class="cat-arrow">&#x25BC;</span>
        </div>
        <div class="category-body">
          ${features.map(f => { idx++; return card(f, idx); }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function card(f, idx) {
  const statusClass = f.status === 'new' ? 'badge-new' : f.status === 'beta' ? 'badge-beta' : 'badge-stable';
  const statusLabel = f.status === 'new' ? 'NEW' : f.status === 'beta' ? 'BETA' : '';
  const core = new Set(['name','category','description','usage','scenario','versionAdded','status','tags','link','_custom']);
  const extra = Object.entries(f).filter(([k]) => !core.has(k));

  return `
    <div class="feature-card${f.popular ? ' popular' : ''}" style="animation-delay:${(idx % 30) * 25}ms">
      ${statusLabel ? `<span class="badge ${statusClass}">${statusLabel}</span>` : ''}
      <div class="card-name">${f.name.startsWith('/') ? `<code>${esc(f.name)}</code>` : esc(f.name)}</div>
      <div class="card-desc">${esc(f.description || '')}</div>
      <div class="card-meta">
        ${f.usage ? `<div class="meta-row"><span class="label">用法</span><span class="value"><code>${esc(f.usage)}</code></span></div>` : ''}
        ${f.scenario ? `<div class="meta-row"><span class="label">场景</span><span class="value">${esc(f.scenario)}</span></div>` : ''}
        ${f.versionAdded ? `<div class="meta-row"><span class="label">版本</span><span class="value">${esc(f.versionAdded)}</span></div>` : ''}
        ${extra.map(([k,v]) => `<div class="meta-row"><span class="label">${esc(k)}</span><span class="value">${esc(String(v))}</span></div>`).join('')}
      </div>
      ${f.tags?.length ? `<div class="card-tags">${f.tags.map(t => `<span class="card-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>
  `;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setCat(cat) {
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
  render();
}

function toggleCat(h) {
  h.classList.toggle('collapsed');
}

// ===================================================================
//  CRUD
// ===================================================================
function showAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function addFeature() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('请输入功能名称', 'error'); return; }
  const tags = document.getElementById('fTags').value.trim();
  const feature = {
    name,
    category: document.getElementById('fCategory').value,
    description: document.getElementById('fDesc').value.trim(),
    usage: document.getElementById('fUsage').value.trim(),
    scenario: document.getElementById('fScenario').value.trim(),
    versionAdded: document.getElementById('fVersion').value.trim(),
    status: document.getElementById('fStatus').value,
    tags: tags ? tags.split(',').map(t => t.trim()).filter(Boolean) : [],
    _custom: true
  };
  customFeatures.push(feature);
  localStorage.setItem('cc_custom_features', JSON.stringify(customFeatures));
  closeModal('addModal');
  ['fName','fDesc','fUsage','fScenario','fVersion','fTags'].forEach(id => document.getElementById(id).value = '');
  render();
  toast(`已添加: ${name}`, 'success');
}

function showJsonModal() {
  document.getElementById('jsonEditor').value = JSON.stringify(getAll(), null, 2);
  document.getElementById('jsonModal').classList.add('open');
}

function exportJson() {
  const blob = new Blob([JSON.stringify(getAll(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `claude-code-features-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON 已下载', 'success');
}

function importJson() {
  try {
    const data = JSON.parse(document.getElementById('jsonEditor').value);
    if (!Array.isArray(data)) throw new Error('必须是数组');
    data.forEach((item, i) => { if (!item.name) throw new Error(`第 ${i+1} 项缺少 name`); });
    const builtin = new Set(featureData.map(f => f.name));
    const nc = data.filter(f => !builtin.has(f.name)).map(f => ({ ...f, _custom: true }));
    customFeatures = nc;
    localStorage.setItem('cc_custom_features', JSON.stringify(customFeatures));
    closeModal('jsonModal');
    render();
    toast(`导入成功！内置 ${featureData.length} + 自定义 ${nc.length}`, 'success');
  } catch(e) {
    toast('JSON 解析失败: ' + e.message, 'error');
  }
}

function toast(msg, type) {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2500);
}

// ===================================================================
//  Init
// ===================================================================
document.addEventListener('DOMContentLoaded', render);
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});
</script>
</body>
